<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agent Runtime · 请求生命周期</title>
<style>
:root {
  color-scheme: light;
  --canvas:#f4f6f9; --dot:#d2d9e4; --panel:#fff; --sub:#f7f9fc;
  --ink:#1b2434; --muted:#526177; --line:#dbe2eb; --edge:#8796ac;
  --blue:#225bec; --blue-soft:#edf3ff; --blue-line:#a9c1ff;
  --success:#14734f; --success-bg:#e8f7ee; --danger:#a83539; --danger-bg:#ffeff0;
  --wait:#855900; --wait-bg:#fff5da; --shadow: 0 3px 8px #1d2e4610,0 16px 34px #2539540b;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
:root[data-theme=dark] {
  color-scheme:dark;
  --canvas:#141923; --dot:#303b4e; --panel:#1d2533; --sub:#202b3b;
  --ink:#eaf0fa; --muted:#a6b5c9; --line:#384559; --edge:#778aa5;
  --blue:#88adff; --blue-soft:#263b61; --blue-line:#537bcf;
  --success:#93e1b8; --success-bg:#203e33; --danger:#ffacae; --danger-bg:#44292e;
  --wait:#f6cf82; --wait-bg:#443924; --shadow:0 8px 26px #080a1180;
}
* {box-sizing:border-box}
html,body {height:100%;margin:0;overflow:hidden}
body {font:13px/1.5 var(--sans);color:var(--ink);background:var(--canvas)}
button,select,textarea {font:inherit;color:inherit}
button,select,textarea {border:1px solid var(--line);background:var(--panel);border-radius:7px}
button {cursor:pointer;padding:6px 10px}
button:hover:not(:disabled) {background:var(--sub);border-color:var(--edge)}
button:disabled {opacity:.42;cursor:default}
button:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible {outline:2px solid var(--blue);outline-offset:2px}
a {color:var(--blue);text-underline-offset:3px}
[hidden] {display:none!important}
.panel,.brand,.toolbar,.canvasbar,.legend {position:absolute;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:11px}
.brand {top:18px;left:18px;min-width:224px;padding:11px 13px;display:flex;gap:10px;align-items:center}
.brand-mark {width:34px;height:34px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.brand h1 {margin:0;font-size:15px;font-weight:690;line-height:1.3;letter-spacing:-.025em}
.brand-meta {display:flex;gap:7px;align-items:center;margin-top:3px;color:var(--muted);font:11px var(--mono)}
.brand a {color:var(--muted)}
.panel {overflow:hidden}
#controls {left:18px;top:98px;width:224px;max-height:calc(100% - 170px)}
#inspector {right:18px;top:18px;width:280px;max-height:calc(100% - 93px);display:flex;flex-direction:column}
.panel-head {height:44px;padding:0 11px 0 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);flex:none}
.panel-head h2 {margin:0;font-size:12px;font-weight:720;display:flex;gap:7px;align-items:center}
.panel-head h2 svg {color:var(--muted)}
.panel-body {border-top:1px solid var(--line);padding:12px;overflow:auto;overscroll-behavior:contain;min-height:0}
#controls .panel-body {max-height:calc(100vh - 215px)}
.panel.collapsed .panel-body {display:none}
.iconbutton {display:grid;place-items:center;width:28px;height:28px;padding:0;color:var(--muted);background:transparent;border-color:transparent}
.icon,button svg {width:16px;height:16px;flex:none}
.field {display:block;margin:0 0 12px}
.field span,.field-label {display:block;font-weight:650;font-size:11px;margin-bottom:5px;color:var(--muted)}
.field select,.field textarea {display:block;width:100%;padding:7px 8px}
.field select {height:34px}
.field textarea {resize:vertical;min-height:56px;max-height:135px;line-height:1.45;background:var(--sub)}
.field:last-child {margin-bottom:0}
.check {display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:11px;color:var(--muted)}
.check input {accent-color:var(--blue)}
.utility {color:var(--muted);font-size:11px;margin:0;padding:10px 1px 1px;border-top:1px solid var(--line)}
#decision-box {border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
#decision-label {display:block;font-size:11px;color:var(--wait);font-weight:700;margin-bottom:7px}
#choices {display:flex;gap:5px;flex-wrap:wrap}
#choices button,#choices select {padding:5px 8px;font-size:11px}
#choices select {width:100%}
#choices button:first-child {color:var(--blue);border-color:var(--blue-line);background:var(--blue-soft)}
#cancel-request {display:flex;gap:6px;align-items:center;margin:9px 0 11px;width:100%;justify-content:center;font-size:11px;color:var(--danger)}
.ins-status {margin-bottom:10px}
.status {display:inline-flex;gap:6px;align-items:center;max-width:100%;border-radius:5px;padding:3px 7px;background:var(--sub);color:var(--muted);font-size:11px;font-weight:680}
.status::before {content:"○";font-size:10px}
.status.active {background:var(--blue-soft);color:var(--blue)}
.status.active::before {content:"▶"}
.status.success {background:var(--success-bg);color:var(--success)}
.status.success::before {content:"✓"}
.status.error {background:var(--danger-bg);color:var(--danger)}
.status.error::before {content:"×"}
.status.wait {background:var(--wait-bg);color:var(--wait)}
.status.wait::before {content:"ǁ"}
.metrics {display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.metric {background:var(--sub);padding:7px 9px;border-radius:6px}
.metric b {display:block;font:600 14px var(--mono)}
.metric span {font-size:10px;color:var(--muted)}
.detail-kicker {font:10px var(--mono);color:var(--muted);margin-top:9px}
.detail-title {margin:3px 0 7px;font-size:16px;line-height:1.34;word-break:break-word;letter-spacing:-.02em}
.detail-text {color:var(--muted);font-size:12px;margin:6px 0 9px}
.from {font-size:11px;margin:7px 0 9px;color:var(--muted);overflow-wrap:anywhere}
.from b {color:var(--ink);font-weight:650}
.signature,.value,.source-code {font:11px/1.55 var(--mono);margin:7px 0 10px;border:1px solid var(--line);border-radius:6px;padding:7px;background:var(--sub);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.signature {color:var(--blue);font-size:10.5px}
.value {max-height:177px;overflow:auto;overscroll-behavior:contain}
.source-code {max-height:235px;overflow:auto;white-space:pre;tab-size:4}
.details {margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.details summary {cursor:pointer;font-weight:650;font-size:11px}
.details p {margin:6px 0;color:var(--muted);font-size:11px}
.source-link {display:block;margin:6px 0;word-break:break-all;font:10px/1.45 var(--mono)}
.preview-link {padding:0;font-size:10px;border:0;color:var(--blue);margin-left:auto;background:transparent}
.field-row {display:flex;gap:8px;align-items:center}
.key {font-family:var(--mono)}
.toolbar {bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:center;padding:5px;white-space:nowrap}
.action {border-color:transparent;display:flex;align-items:center;gap:6px;min-height:31px;font-size:11px}
.action.primary {color:white;background:#225bec;border-color:#225bec}
.action.primary:hover:not(:disabled) {background:#184ad2;border-color:#184ad2}
.toolbar .indicator {border-left:1px solid var(--line);padding:0 9px 0 10px;margin-left:3px;font:11px var(--mono);color:var(--muted)}
.canvasbar {bottom:18px;right:18px;padding:4px;display:flex;align-items:center;gap:2px}
.canvasbar button {display:grid;place-items:center;min-width:28px;height:29px;padding:0 6px;background:transparent;border-color:transparent;color:var(--muted);font-size:11px}
.canvasbar #all-relations {padding-inline:8px;white-space:nowrap}
.canvasbar #all-relations[aria-pressed=true] {background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.canvasbar output {min-width:40px;text-align:center;font:11px var(--mono);color:var(--muted)}
.legend {left:18px;bottom:18px;padding:7px 9px;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted)}
.legend span {display:flex;align-items:center;gap:4px}
.legend i {width:15px;border-top:1px solid var(--edge)}
.legend .data {border-top-style:dashed}
.legend .dep {border-top:2px dotted var(--edge)}
.canvas {position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:19px 19px}
.canvas.drag {cursor:grabbing}
.graph-title {font:700 14px var(--sans);fill:var(--muted);paint-order:stroke;stroke:var(--canvas);stroke-width:5;pointer-events:none}
.node {cursor:pointer;outline:none}
.node-frame {fill:var(--panel);stroke:var(--line);stroke-width:1.35;filter:url(#node-shadow)}
.node:hover .node-frame,.node:focus .node-frame,.node.selected .node-frame {stroke:var(--blue-line);stroke-width:2}
.node.active .node-frame {fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
.node.waiting .node-frame {fill:var(--wait-bg);stroke:var(--wait);stroke-width:2}
.node.completed .node-frame {fill:var(--success-bg);stroke:var(--success);stroke-width:2}
.node.ended-error .node-frame {fill:var(--danger-bg);stroke:var(--danger);stroke-width:2}
.node-tag {font:10.5px var(--mono);fill:var(--muted)}
.node-title {font:700 16px var(--mono);fill:var(--ink)}
.node[data-kind=decision] .node-title,.node[data-kind=boundary] .node-title {font:700 15px var(--sans)}
.node-desc {font:11px var(--sans);fill:var(--muted)}
.node-field {font:10.5px var(--mono);fill:var(--muted)}
.node-method {outline:none}
.node-method rect {fill:transparent}
.node-method:hover rect,.node-method:focus rect,.node-method.method-selected rect {fill:var(--blue-soft)}
.node-method.method-live rect {fill:var(--blue-line);fill-opacity:.33}
.node-method text {font:10.5px var(--mono);fill:var(--ink)}
.node-method.method-live text {fill:var(--blue);font-weight:700}
.node-rule {stroke:var(--line);stroke-width:1}
.node-flag {font:800 11px var(--sans);fill:var(--blue)}
.node.waiting .node-flag {fill:var(--wait)}
.node.completed .node-flag {fill:var(--success)}
.node.ended-error .node-flag {fill:var(--danger)}
.edge {fill:none;stroke:var(--edge);stroke-width:1.35;marker-end:url(#arrow);opacity:.82}
.edge.data {stroke-dasharray:5 4}
.edge.dep {stroke-dasharray:1 3.6;stroke-linecap:round;stroke-width:1.8;marker-end:url(#open-arrow)}
.edge.visited,.edge.current {stroke:var(--blue);marker-end:url(#arrow-blue)}
.edge.visited {opacity:.46}
.edge.current {opacity:1;stroke-width:2.4}
.edge.dep.visited,.edge.dep.current {marker-end:url(#open-arrow-blue)}
.edge-note {font:11px var(--sans);fill:var(--muted);paint-order:stroke;stroke:var(--canvas);stroke-width:4;stroke-linejoin:round;pointer-events:none}
.edge-note.visited {opacity:.65}
.edge-note.current {fill:var(--blue)}
@media (max-width:1100px) {
  #controls,.brand {left:10px}
  #inspector,.canvasbar {right:10px}
  #controls {width:185px}
  #inspector {width:218px}
  .legend {display:none}
  .brand {min-width:185px}
  .action span {display:none}
  .toolbar .action {padding-inline:8px}
}
@media (max-width:800px) {
  .brand {top:9px;min-width:0;padding:7px 9px}
  .brand-mark {width:27px;height:27px}
  .brand h1 {font-size:13px}
  #controls {top:67px;width:min(210px,54vw);max-height:calc(100% - 150px)}
  #inspector {top:9px;width:min(215px,45vw);max-height:calc(100% - 155px)}
  #controls .panel-body {max-height:calc(100vh - 195px)}
  .toolbar {bottom:10px;left:10px;transform:none}
  .canvasbar {bottom:57px}
  .canvasbar button {min-width:24px;padding-inline:3px}

}
@media (max-width:360px) {
  .brand {gap:6px}
  .brand-mark {width:23px;height:23px}
}
@media (prefers-reduced-motion: reduce) { * {scroll-behavior:auto!important} }
</style>
</head>
<body>
<svg id="canvas" class="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="可平移缩放的请求生命周期画布">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--blue)"/></marker>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="var(--edge)" stroke-width="1.5"/></marker>
    <marker id="open-arrow-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="var(--blue)" stroke-width="1.5"/></marker>
    <filter id="node-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#13253e" flood-opacity=".09"/></filter>
  </defs>
  <g id="viewport"><g id="guides"></g><g id="connections"></g><g id="cards"></g></g>
</svg>
<header class="brand">
  <div class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="14.5" y="14.5" width="6" height="6" rx="1"/><path d="M9.5 6.5h5a3 3 0 0 1 3 3v5m-3-3 3 3 3-3"/></svg></div>
  <div><h1>Agent Runtime</h1><div class="brand-meta"><span id="version"></span><span aria-hidden="true">/</span><a id="commit" target="_blank" rel="noreferrer"></a></div></div>
</header>
<aside id="controls" class="panel" aria-label="运行配置">
  <div class="panel-head"><h2><span data-icon="sliders"></span>运行配置</h2><button class="iconbutton collapse" type="button" data-panel="controls" aria-expanded="true" aria-controls="controls-body" title="折叠运行配置" aria-label="折叠运行配置"></button></div>
  <div class="panel-body" id="controls-body">
    <label class="field"><span>参考场景</span><select id="track"><option value="agent">Agent · 文档对比（MCP）</option><option value="host">Runstate · 审批与结果核验</option></select></label>
    <label class="field"><span>用户请求</span><textarea id="prompt" rows="2" maxlength="500"></textarea></label>
    <label class="field"><span>脚本模型响应</span><select id="model-mode"></select></label>
    <label class="field" id="access-field"><span>宿主授权规则</span><select id="access"><option value="allow">允许本地与远端</option><option value="deny">远端未授权</option></select></label>
    <label class="field" id="effect-field"><span>远端工具返回</span><select id="effect"><option value="success">成功</option><option value="business">业务失败</option><option value="timeout">超时</option><option value="budget">超出结果大小</option><option value="corrupt">执行后响应损坏</option></select></label>
    <label class="check" id="checkpoint-field" hidden><input id="checkpoint" type="checkbox">查看 Checkpoint 与暂停快照</label>
    <label class="check" id="week04-field" hidden><input id="week04" type="checkbox">第四周组合入口（Day 28）</label>
    <div id="decision-box" hidden><span id="decision-label"></span><div id="choices"></div></div>
    <button type="button" id="cancel-request" hidden><span data-icon="stop"></span>取消原始请求</button>
    <p class="utility">基于 <span class="key">examples/</span> 的教学模拟。模型与工具使用离线夹具。</p>
  </div>
</aside>
<aside id="inspector" class="panel" aria-label="执行详情">
  <div class="panel-head"><h2><span data-icon="inspect"></span>执行详情</h2><button class="iconbutton collapse" type="button" data-panel="inspector" aria-expanded="true" aria-controls="inspector-body" title="折叠执行详情" aria-label="折叠执行详情"></button></div>
  <div id="inspector-body" class="panel-body"><div class="field-row ins-status"><span class="status" id="run-status" role="status" aria-live="polite"></span><button id="follow" class="preview-link" type="button" hidden>跟随执行</button></div><div id="detail"></div></div>
</aside>
<div class="legend" aria-label="连线图例"><span><i></i>调用</span><span><i class="data"></i>数据</span><span><i class="dep"></i>接口分派</span></div>
<div class="toolbar" role="group" aria-label="执行控制">
  <button class="action primary" id="play" type="button" data-icon="play" title="运行" aria-label="运行"><span>运行</span></button>
  <button class="action" id="pause-run" type="button" data-icon="pause" title="暂停播放" aria-label="暂停播放"><span>暂停</span></button>
  <button class="action" id="prev" type="button" data-icon="prev" title="上一步" aria-label="上一步"><span>上一步</span></button>
  <button class="action" id="next" type="button" data-icon="next" title="下一步" aria-label="下一步"><span>下一步</span></button>
  <button class="action" id="rerun" type="button" data-icon="reset" title="重新运行" aria-label="重新运行"><span>重新运行</span></button>
  <output id="step-index" class="indicator" aria-label="当前步骤">步骤 0</output>
</div>
<div class="canvasbar" role="group" aria-label="画布控制">
  <button id="all-relations" type="button" aria-pressed="false" aria-controls="viewport">全部关系</button>
  <button id="theme" type="button" data-icon="theme" title="切换主题" aria-label="切换主题"></button>
  <button id="zoom-out" type="button" data-icon="minus" title="缩小" aria-label="缩小"></button>
  <output id="zoom-value" aria-label="缩放比例">100%</output>
  <button id="zoom-in" type="button" data-icon="plus" title="放大" aria-label="放大"></button>
  <button id="fit" type="button" data-icon="fit" title="适应当前视图" aria-label="适应当前视图"></button>
  <button id="reset-view" type="button" data-icon="reset" title="重置视图" aria-label="重置视图"></button>
</div>
<noscript>启用 JavaScript 后可查看和操作离线画布。</noscript>

      "code": "// Build initializes/discovers capabilities but does not invoke business tools.\n// The caller owns transport cleanup; a failed/ambiguous session is not replayed.\nfunc Build(ctx context.Context, c Config) (*Runtime, error) {\n\tif err := ctx.Err(); err != nil {\n\t\treturn nil, err\n\t}\n\tif c.Model == nil || c.Local == nil || c.Transport == nil || c.MaxPages <= 0 || c.MaxSteps <= 0 || c.ToolTimeout < 0 {\n\t\treturn nil, fmt.Errorf(\"assembly: invalid config\")\n\t}\n\tclient, err := mcp.NewClient(c.Transport)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif _, err = client.Initialize(ctx); err != nil {\n\t\treturn nil, err\n\t}\n\tcandidates, err := mcptool.Discover(ctx, client, c.Prefix, c.MaxPages)\n\tif err != nil {\n\t\treturn nil, err\n\t}"
    },
    "mcp-106-142": {
      "path": "examples/internal/mcp/client.go",
      "start": 106,
      "end": 142,
      "code": "func (c *Client) Initialize(ctx context.Context) (InitializeResult, error) {\n\tvar result InitializeResult\n\tif err := c.enter(ctx); err != nil {\n\t\treturn result, err\n\t}\n\tdefer c.leave()\n\tif c.state != \"new\" {\n\t\treturn result, ErrSessionState\n\t}\n\t// Never replay initialization on an ambiguous, possibly initialized transport.\n\tc.state = \"failed\"\n\traw, err := c.rpc(ctx, \"initialize\", struct {\n\t\tProtocolVersion string         `json:\"protocolVersion\"`\n\t\tCapabilities    struct{}       `json:\"capabilities\"`\n\t\tClientInfo      Implementation `json:\"clientInfo\"`\n\t}{ProtocolVersion: ProtocolVersion, ClientInfo: Implementation{Name: \"agent-runtime-examples\", Version: \"0.1.0\"}})\n\tif err != nil {\n\t\treturn result, err\n\t}\n\tif json.Unmarshal(raw, &result) != nil || result.ProtocolVersion != ProtocolVersion || result.Capabilities == nil || result.ServerInfo.Name == \"\" || result.ServerInfo.Version == \"\" {\n\t\treturn result, c.protocol(\"unsupported version or invalid initialize result\")\n\t}\n\tnotification, _ := json.Marshal(request{JSONRPC: \"2.0\", Method: \"notifications/initialized\"})\n\treply, err := c.transport.Send(ctx, notification)\n\tif ctx.Err() != nil {\n\t\terr = ctx.Err()\n\t}\n\tif err != nil {\n\t\treturn result, fmt.Errorf(\"mcp initialized notification: %w\", err)\n\t}\n\tif len(bytes.TrimSpace(reply)) != 0 {\n\t\treturn result, c.protocol(\"notification must not receive a response\")\n\t}\n\tc.toolsAvailable = result.Capabilities.Tools != nil\n\tc.state = \"ready\"\n\treturn result, nil\n}"
    },

      "code": "func Discover(ctx context.Context, caller Caller, prefix string, maxPages int) ([]tool.Invokable, error) {\n\tif caller == nil || !prefixPattern.MatchString(prefix) || maxPages <= 0 {\n\t\treturn nil, fmt.Errorf(\"%w: invalid discovery configuration\", ErrDiscovery)\n\t}\n\ttools := make([]tool.Invokable, 0)\n\tseenNames := make(map[string]bool)\n\tseenCursors := map[string]bool{\"\": true}\n\tcursor := \"\"\n\tfor pageNumber := 0; pageNumber < maxPages; pageNumber++ {\n\t\tif err := ctx.Err(); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tpage, err := caller.ListTools(ctx, cursor)\n\t\tif ctx.Err() != nil {\n\t\t\treturn nil, ctx.Err()\n\t\t}\n\t\tif err != nil {\n\t\t\treturn nil, fmt.Errorf(\"mcptool: listing tools: %w\", err)\n\t\t}\n\t\tif page.Tools == nil {\n\t\t\treturn nil, fmt.Errorf(\"%w: tools array required\", ErrDiscovery)\n\t\t}"
    },

      "code": "// Register 读取一次元信息；不调用 Invoke。重复名称绝不覆盖。\nfunc (r *Registry) Register(ctx context.Context, t Invokable) error {\n\tif err := ctx.Err(); err != nil {\n\t\treturn err\n\t}\n\tif t == nil {\n\t\treturn fmt.Errorf(\"tool: nil invokable\")\n\t}\n\ts, err := t.Meta(ctx)\n\tif err != nil {\n\t\treturn err\n\t}\n\tif err = validateSpec(s); err != nil {\n\t\treturn err\n\t}\n\tr.mu.Lock()\n\tdefer r.mu.Unlock()\n\tif r.entries == nil {\n\t\tr.entries = make(map[string]registration)\n\t}\n\tif _, exists := r.entries[s.Name]; exists {\n\t\treturn fmt.Errorf(\"tool: duplicate name %q\", s.Name)\n\t}\n\tr.entries[s.Name] = registration{spec: cloneSpec(s), target: t}\n\treturn nil"

      "code": "// RunWithState returns a final, independent observation snapshot, even on a Run error.\n// It does not persist, resume, or authorize replay from a snapshot.\nfunc (a *Agent) RunWithState(ctx context.Context, input string) (result RunResult, runErr error) {\n\trecord, err := newRunRecord(input)\n\tif err != nil {\n\t\treturn RunResult{}, err\n\t}\n\tif err = record.transition(RunRunning); err != nil {\n\t\treturn RunResult{Snapshot: record.snapshot()}, err\n\t}\n\tstarted := time.Now()\n\ta.emit(ctx, Event{Type: EventRunStarted, Status: \"ok\"})\n\tdefer func() {\n\t\trunErr = record.finish(runErr)\n\t\tif runErr != nil {\n\t\t\tresult.Output = \"\"\n\t\t}\n\t\tresult.Snapshot = record.snapshot()\n\t\tkind := EventRunFinished\n\t\tif runErr != nil {\n\t\t\tkind = EventRunFailed\n\t\t}\n\t\ta.emit(ctx, Event{Type: kind, Step: record.data.Step, Duration: time.Since(started), Status: status(runErr)})\n\t}()"

const architecture = JSON.parse(document.getElementById("reference-data").textContent);

// the reducers so navigation can rewind and branch without mutating earlier steps.
const prompts = {
  agent: 'compare known local-1 and remote-1 documents',
  host: '读取 doc-1 和 doc-2'
};

const request = (id, name, doc) => ({ ID: id, Name: name, Arguments: JSON.stringify({id: doc}) });
const assistant = (content, calls) => ({
  Role: 'assistant', Content: content, ...(calls?.length ? {ToolCalls: calls} : {})
});
const description = (role, content) => ({Role:role, Content:content});
const extra = architecture.extra;
const phaseNames = {
  idle:'待运行', assembly:'初始化装配', created:'已创建', running:'运行中',
  ready:'就绪', model_running:'模型推理', tools_pending:'等待工具', tools_running:'工具运行',
  completed:'已完成', failed:'失败', cancelled:'已取消'
};

function initial(config) {
  return {
    config, at:'start', phase:'idle', round:0, messages:[], calls:[], pending:[],
    events:[], err:null, failureClass:'', output:'', invoked:[], queries:0,
    maxSteps:config.track === 'host' ? 4 : config.mode === 'budget' ? 1 : 3,
    status:'教学模拟已就绪'
  };
}
function step(s, at, ref, title, info = {}) {
  return Object.assign(s, {at, view:{ref,title,...info}});
}
function emit(s,name) { s.events.push(name); }
function finishAgent(s, error, failureClass, reason, edges) {
  s.err = error;
  s.failureClass = failureClass || '';
  s.phase = !error ? 'completed' : ['cancelled','deadline_exceeded'].includes(failureClass) ? 'cancelled' : 'failed';
  for (const call of s.calls) {
    if (call.Status === 'planned') call.Status = 'blocked';
    else if (call.Status === 'running') call.Status = 'unconfirmed';
  }
  if (error) s.output = '';
  emit(s,error ? 'EventRunFailed' : 'EventRunFinished');
  return step(s,'a-finish','record.finish','提交 Run 终态',{
    edges, from:'Agent.RunWithState · defer', input:{ runErr:error },
    output:{ Status:s.phase, FailureClass:s.failureClass, Calls:s.calls },
    reason, source:extra.finish
  });
}
function agentGenerate(s) {
  s.round++;
  emit(s,'EventStepStarted');
  return step(s,'a-generate','model.generate','调用脚本模型',{
    edges:[s.round === 1 ? 'a-model' : 'a-loop'], from:'Agent.RunWithState',
    input:{ctx:'原始请求 context', messages:s.messages},
    reason:s.config.mode==='model-error'?'使用没有预设响应的 model.Mock。':'轮次预算内且 ctx.Err() == nil。', cancel:true, source:s.config.mode==='model-error'?extra.mock:extra.loop
  });
}
function agentBeforeModelCancel(s) {
  s.round++;
  return finishAgent(s,'context.Canceled','cancelled','进入下一轮时先检查原始 context，模型未被调用。',[]);
}
function agentCallStart(s) {
  const call = s.batch[s.index];
  s.calls[s.index].Status = 'running';
  s.invoked.push(call.Name);
  emit(s,'EventToolStarted');
  return step(s,'a-policy','policy.execute','开始单个工具调用',{
    edges:['a-execute',...(s.index ? ['a-next'] : [])], from:'Agent.executeBatchWithState → tool.Tool.Execute',
    input:{tool:call.Name, args:call.Arguments, step:s.round}, output:{Status:'running'},
    reason:'整批已授权。Agent 创建工具子 context；策略再约束逻辑调用，默认 MaxAttempts=1。', source:extra.callStart
  });
}
function packAgentCall(s, content, cause) {
  const current = s.calls[s.index];
  const event = toolMessage(current.CallID, content);
  current.Status = cause ? 'errored' : 'returned';
  current.Result = event;
  s.batchResults.push(event);
  emit(s,'EventToolCompleted');
  return step(s,'a-pack','history.pack','形成工具消息',{
    edges:[s.index ? 'a-remotepack' : 'a-localret'], from:'Agent.executeBatchWithState',
    input:{content, err:cause}, output:event, source:extra.callEnd,
    reason:cause ? '普通工具错误已转为受控文本。该消息仍与原 CallID 配对。' : '工具返回内容与原始模型 CallID 配对。'
  });
}
function interruptAgentCall(s, error, failureClass) {
  s.calls[s.index].Status = 'unconfirmed';
  emit(s,'EventToolCompleted');
  s.toolStop = {error,failureClass};
  return step(s,'a-toolstop','history.pack','工具调用结果未确认',{
    edges:['a-remoteret','a-remotepack'], from:'Agent.executeBatchWithState',
    input:{err:error}, output:{Status:'unconfirmed', 'batch results':null, err:error},
    reason:'取消或超时使整批返回错误。之前已经 returned 的调用仍留在快照，但整批结果不会加入历史。',
    source:extra.callEnd, tone:'error'
  });
}

function hostState(s) {
  return structuredClone({
    RunID:(s.config.week04?'r28':'r27'),Phase:s.phase,Step:s.round,MaxSteps:s.maxSteps,Messages:s.messages,
    Pending:s.pending.length ? s.pending : null,Result:s.output,Failure:s.hostFailure || ''
  });
}
function hostApply(s,event) {
  const invalid='runstate.ErrTransition';
  const before=s.phase;
  if (['completed','failed','cancelled'].includes(before)) return invalid;
  if (s.hostCancelled) event={Kind:'Cancel'};
  switch (event.Kind) {
    case 'StartModel':
      if (before!=='ready') return invalid;
      if (s.round >= s.maxSteps) return 'runstate.ErrMaxSteps';
      s.phase='model_running'; s.round++; break;
    case 'ModelReturned': {
      const message=event.Response?.Message;
      if (before!=='model_running' || message?.Role!=='assistant') return invalid;
      const calls=message.ToolCalls || [];
      const ids=new Set();
      for (const call of calls) {
        if (!call.ID || !call.Name.trim() || ids.has(call.ID)) return invalid;
        ids.add(call.ID);
      }
      s.messages.push(message);
      s.pending=calls;
      s.phase=calls.length ? 'tools_pending' : 'completed';
      if (!calls.length) s.output=message.Content;
      break;
    }
    case 'StartTools':
      if (before!=='tools_pending') return invalid;
      s.phase='tools_running';
      break;
    case 'ToolsReturned':
      if (before!=='tools_running' || event.Results?.length!==s.pending.length ||
        event.Results.some((msg,i)=>msg.Role!=='tool' || msg.ToolCallID!==s.pending[i].ID)) return invalid;
      s.messages.push(...event.Results); s.pending=[]; s.phase='ready'; break;
    case 'Abort':
      if (!event.Reason?.trim()) return invalid;
      s.phase='failed'; s.hostFailure=event.Reason; break;
    case 'Cancel':
      s.phase='cancelled'; s.hostFailure='cancelled'; break;
    default: return invalid;
  }
  if (['completed','failed','cancelled'].includes(s.phase)) {
    s.pauseRequest=null; s.decision=null;
  }
  s.change=before+' → '+s.phase;
  return s.hostCancelled ? 'context.Canceled' : null;
}

function anchor(ref,side,offset=0) {

  const {height,methodTop}=dimensions(node);
  const methodIndex=node.methods.indexOf(method);
  const y=method ? methodTop+methodIndex*ROW+8 : 34;
  if (side==='l') return [node.x,node.y+y+offset];
  if (side==='r') return [node.x+WIDTH,node.y+y+offset];
  if (side==='t') return [node.x+WIDTH/2+offset,node.y];

}
function edgePoints(edge) {
  const start=anchor(edge.a,edge.ports[0],edge.offsets?.[0]), finish=anchor(edge.b,edge.ports[1],edge.offsets?.[1]);
  if (edge.via.length) return [start,...edge.via,finish];
  if (start[0]===finish[0] || start[1]===finish[1]) return [start,finish];
  if (edge.ports==='rl'||edge.ports==='lr') {
    const middle=(start[0]+finish[0])/2;
    return [start,[middle,start[1]],[middle,finish[1]],finish];

function drawLink(id,edge) {

function boxesOverlap(a,b) {
  return a.x<b.x+b.width && a.x+a.width>b.x && a.y<b.y+b.height && a.y+a.height>b.y;
}
function drawLinkText(entry,obstacles,segments) {
  const {points,edge}=entry;
  if (!edge.label) return;
  const text=makeText(linkLabels,'edge-note',0,0,edge.label);
  text.setAttribute('text-anchor','middle');
  const measured=text.getBBox();
  const width=measured.width+8, height=measured.height+6;
  const candidates=[];
  for (let i=1;i<points.length;i++) {
    const [x,y]=points[i-1], [nextX,nextY]=points[i];
    if (y===nextY && Math.abs(nextX-x)>=width+8) {
      for (const position of [.5,.3,.7]) {
        const center=Math.max(Math.min(x,nextX)+width/2+4,Math.min(x+(nextX-x)*position,Math.max(x,nextX)-width/2-4));
        candidates.push({x:center,y:y-7,priority:Math.abs(nextX-x)});
        candidates.push({x:center,y:y+17,priority:Math.abs(nextX-x)-10});
      }
    } else if (x===nextX && Math.abs(nextY-y)>=height+12) {
      for (const position of [.5,.3,.7]) {
        const middle=y+(nextY-y)*position+4;
        candidates.push({x:x+width/2+5,y:middle,priority:0},{x:x-width/2-5,y:middle,priority:0});
      }
    }
  }
  candidates.sort((a,b)=>b.priority-a.priority);
  for (const {x,y} of candidates) {
    const box={x:x-width/2,y:y+measured.y-3,width,height};
    if (obstacles.some(other=>boxesOverlap(box,other)) || segments.some(segment=>boxesOverlap(box,segment))) continue;
    text.setAttribute('x',x);
    text.setAttribute('y',y);
    obstacles.push(box);
    entry.text=text;
    return;
  }
  text.remove();
}
function drawGraph(track) {
  cardInfo.clear();
  edgeInfo.clear();
  sectionInfo.length=0;
  cards.replaceChildren();
  guides.replaceChildren();
  paths.replaceChildren();
  linkLabels.replaceChildren();
  for (const {title,ids} of graphSections[track]) {
    const bounds=enclosingBounds(ids.map(cardBounds));
    const heading=makeText(guides,'graph-title',bounds.x,bounds.y-26,title);
    sectionInfo.push({heading,ids});
  }
  const ids=new Set(architecture.tracks[track]);
  for (const [id,edge] of Object.entries(edges)) {
    if (ids.has(refParts(edge.a).id) && ids.has(refParts(edge.b).id)) drawLink(id,edge);
  }
  ids.forEach(drawCard);
  const obstacles=[...ids].map(cardBounds);
  for (const {heading} of sectionInfo) obstacles.push(heading.getBBox());
  const wires=[...edgeInfo.values()].flatMap(({points})=>points.slice(1).map(([x,y],i)=>{
    const [previousX,previousY]=points[i];
    return {x:Math.min(x,previousX)-1,y:Math.min(y,previousY)-1,width:Math.abs(x-previousX)+2,height:Math.abs(y-previousY)+2};
  }));
  for (const entry of edgeInfo.values()) drawLinkText(entry,obstacles,wires);
}
function transform() {

  $('zoom-value').textContent=Math.round(view.scale*100)+'%';

function canvasArea() {
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if (w<=800) return {left:16,right:w-16,top:123,bottom:h-105};
  return {
    left:$('controls').getBoundingClientRect().right+20,
    right:$('inspector').getBoundingClientRect().left-20,
    top:25,bottom:h-77

}
function focusBounds() {
  const track=$('track').value;

  const bounds=enclosingBounds(focus.map(cardBounds));
  const loop=edgeInfo.get(track==='agent' ? 'a-loop' : 'h-next');
  const left=loop.path.hasAttribute('hidden') ? bounds.x : Math.min(...loop.points.map(([x])=>x));

function frameGraph(actualSize=false) {

  const fitScale=Math.min((right-left)/world.width,(bottom-top)/world.height,1);
  const minScale=allRelations ? .13 : canvas.clientWidth<=800 ? .9 : .78;
  view.scale=actualSize ? 1 : Math.max(minScale,fitScale);
  view.x=left+Math.max(0,(right-left-world.width*view.scale)/2)-world.x*view.scale;
  view.y=top+(allRelations&&!actualSize ? Math.max(0,(bottom-top-world.height*view.scale)/2) : 0)-world.y*view.scale;

function revealCard(ref) {

  const {x,y,width,height}=cardBounds(refParts(ref).id);
  const x1=view.x+x*view.scale, y1=view.y+y*view.scale;
  const x2=x1+width*view.scale, y2=y1+height*view.scale;
  const dx=x1<left || x2-x1>right-left ? left-x1 : Math.min(0,right-x2);
  const dy=y1<top || y2-y1>bottom-top ? top-y1 : Math.min(0,bottom-y2);

  view.y+=dy;

function zoom(scale,x,y) {

  view.x=x-(x-view.x)*factor;
  view.y=y-(y-view.y)*factor;

function centerZoom(factor) {

$('zoom-in').onclick=()=>centerZoom(1.2);
$('zoom-out').onclick=()=>centerZoom(1/1.2);

const pointers=new Map();
let dragging=false, dragMoved=false, dragOrigin=null;
function pointerCenter() {
  const positioned=[...pointers.values()];
  if (positioned.length===1) return {...positioned[0],dist:0};
  const [a,b]=positioned;
  return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,dist:Math.hypot(a.x-b.x,a.y-b.y)};

canvas.addEventListener('pointerdown',e=>{
  if (e.button!==0 && e.button!==1) return;
  if (!pointers.size) {
    dragMoved=false;
    dragging=false;
    dragOrigin={x:e.clientX,y:e.clientY};
  }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
canvas.addEventListener('pointermove',e=>{
  if (!pointers.has(e.pointerId)) return;
  const a=pointerCenter();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const b=pointerCenter();
  if (!dragging && (pointers.size>1 || Math.hypot(b.x-dragOrigin.x,b.y-dragOrigin.y)>4)) {
    dragging=true;
    dragMoved=true;
    canvas.classList.add('drag');
    for (const id of pointers.keys()) canvas.setPointerCapture(id);
  }
  if (!dragging) return;
  view.x+=b.x-a.x;
  view.y+=b.y-a.y;
  fitMode=false;
  if (a.dist>0 && b.dist>0) zoom(view.scale*b.dist/a.dist,b.x,b.y);

});
function releasePointer(e) {
  pointers.delete(e.pointerId);
  if (!pointers.size) {

}

function reset(message) {

  trail=[state];

function stop() {
  if (playback !== null) clearTimeout(playback);
  playback=null;
}
function advance(choice) {
  if (now().at === 'done' || (now().view?.wait && !choice)) return;
  if (index===0 && !choice) trail[index]=initial(readConfig());
  const result=next(now(),choice);
  trail.splice(index+1,trail.length,result);
  index++;
  selection=null;
  const resume=!!choice && choice!=='cancel' && resumeAfterChoice;
  if (choice) resumeAfterChoice=false;
  if (result.view.wait) {
    resumeAfterChoice=playback!==null;
    stop();
    showPanel('controls',true);
  } else if (result.at==='done') stop();

  revealCard(result.view.ref);

  playback=setTimeout(()=>{

    if (playback!==null) schedule();
  },650);

  if (now().at==='done' || now().view?.wait || playback!==null) return;
  schedule();

function runStatus(s) {
  if (s.phase==='idle') return ['',s.status];
  if (s.view?.wait) return ['wait', s.view.wait==='approval' ? '等待审批' : s.view.wait==='resolve' ? '等待消费决定' : '等待工具结果情形'];
  if (s.phase==='failed') return ['error','失败 · '+(s.hostFailure ? '审批拒绝' : s.failureClass==='max_steps' ? '轮次耗尽' : '请求结束')];
  if (s.phase==='cancelled') return ['error','已取消 · '+(s.failureClass==='deadline_exceeded'?'工具超时':'原始请求')];
  if (s.phase==='completed') return ['success','已完成'];
  if (s.at==='done' && s.err) return [s.phase==='ready'?'error':'wait',phaseNames[s.phase]+' · 核验未提交'];
  return ['active',phaseNames[s.phase]];
}
function scenarioEdges(config) {
  const {track,mode,access,checkpoint,week04}=config;
  const tools=usesTools(mode);
  if (track==='agent') {
    const links=['a-in','a-model','a-response','a-end'];
    if (mode==='direct') links.push('a-direct');
    else if (mode==='model-error') links.push('a-modelerr');
    else if (mode==='duplicate') links.push('a-batch','a-invalid');
    else if (access==='deny') links.push('a-batch','a-pre','a-auth','a-auth-ret','a-deny');
    else if (tools) links.push(...agentToolEdges);
    return links;
  }
  const links=['h-response'];
  if (tools) {
    links.push(...hostToolEdges);
    if (checkpoint) links.push(...checkpointEdges);
    else if (week04) links.push('h-snap','h-snapret');
  } else links.push('h-direct');
  if (week04) links.push('w4-execute','w4-report');
  return links;
}
function updateCanvas(s) {
  const current=new Set(s.view?.edges);
  const visited=new Set(trail.slice(1,index).flatMap(entry=>entry.view.edges || []));
  const visibleEdges=new Set([...scenarioEdges(s.config),...visited,...current]);
  const visibleCards=new Set(s.config.track==='agent' ? ['input','agent','model','response','result'] : ['hmodel','hresponse','hresult']);
  const ref=selection || s.view?.ref;
  const selected=ref ? refParts(ref) : {};
  const live=s.view ? refParts(s.view.ref) : {};
  if (selected.id) visibleCards.add(selected.id);
  if (live.id) visibleCards.add(live.id);
  for (const [id,{path,text,ids}] of edgeInfo) {
    const visible=allRelations || visibleEdges.has(id);
    const active=current.has(id);
    const past=!active && visited.has(id);
    if (visible) ids.forEach(nodeId=>visibleCards.add(nodeId));
    for (const element of [path,text]) {
      if (!element) continue;
      element.toggleAttribute('hidden',!visible);
      element.classList.toggle('current',active);
      element.classList.toggle('visited',past);
    }
    // Keep the current step above earlier lines where two paths cross.
    if (active) paths.append(path);
  }
  for (const {heading,ids} of sectionInfo) {
    heading.toggleAttribute('hidden',!ids.some(id=>visibleCards.has(id)));
  }
  const [status]=runStatus(s);
  for (const [id,{card,methods,flag}] of cardInfo) {
    const active=live.id===id;
    card.toggleAttribute('hidden',!visibleCards.has(id));
    card.classList.toggle('selected',selected.id===id);
    card.classList.toggle('active',active);
    card.classList.toggle('waiting',active && status==='wait');
    card.classList.toggle('completed',active && status==='success' && s.at==='done');
    card.classList.toggle('ended-error',active && (status==='error' || s.view?.tone==='error'));
    const [glyph,label]=!active ? ['',null] : status==='wait' ? ['ǁ','等待'] : status==='success' && s.at==='done' ? ['✓','完成'] : status==='error'||s.view?.tone==='error' ? ['×','错误'] : ['▶','当前步骤'];
    flag.textContent=glyph;
    if (label) card.setAttribute('aria-description',label);
    else card.removeAttribute('aria-description');
    for (const [methodId,{g}] of methods) {
      g.classList.toggle('method-live',active && live.method?.id===methodId);
      g.classList.toggle('method-selected',selected.id===id && selected.method?.id===methodId);
    }
  }
}

function expandable(label,content,open=false) {

  detail.open=open;
  detail.append(el('summary',null,label),content);
  return detail;
}
function valueField(label,value,open) {
  const lines=typeof value==='string'?value:JSON.stringify(value,null,2);
  return expandable(label,el('pre','value',lines),open);
}
function sourceLink(source) {
  const path=source.path+':'+source.start+(source.end===source.start?'':'–'+source.end);
  const link=el('a','source-link',path);
  link.href=repo+'/blob/'+architecture.commit+'/'+source.path+'#L'+source.start+(source.end===source.start?'':'-L'+source.end);
  link.target='_blank'; link.rel='noreferrer';
  return link;
}
function sourceField(id) {
  const source=sources[id];
  const body=el('div');
  const code=source.code.split('\n').map((line,i)=>String(i+source.start).padStart(3)+'  '+line).join('\n');
  body.append(el('pre','source-code',code));
  return expandable('源码片段',body);
}
function summary(s,detail) {
  detail.append(el('div','detail-kicker',s.config.track==='agent'?'Agent.RunWithState':'runstate.PauseGate'));
  detail.append(el('h3','detail-title',s.at==='start'?'一次请求的生命周期':'运行状态'));
  if (s.at==='start') {
    detail.append(el('p','detail-text',s.config.track==='agent'?'从宿主装配到模型、整批授权与 MCP 调用。':
      '宿主通过独立门禁推进状态、消费审批并核验工具结果。'));
  }
  const metrics=el('div','metrics');
  for (const [label,value] of [['模型轮次',s.round+' / '+s.maxSteps],['历史消息',s.messages.length]]) {
    const box=el('div','metric'); box.append(el('b',null,value),el('span',null,label)); metrics.append(box);
  }
  detail.append(metrics);
  if (s.at==='start') {
    detail.append(el('p','detail-text','运行或单步推进。点击节点或方法可独立查看源码。'));
    detail.append(valueField('请求输入',s.config.prompt,false));
  }
}
function showInspector(s) {
  const [tone,status]=runStatus(s);
  $('run-status').className='status '+tone;
  $('run-status').textContent=status;
  $('follow').hidden=!selection;
  const detail=$('detail');
  detail.replaceChildren();
  const live=!selection ? s.view : null;
  const ref=selection||live?.ref;
  if (!ref) {summary(s,detail);return;}
  const {node,method}=refParts(ref);
  detail.append(el('div','detail-kicker',node.namespace+' · '+node.title));
  detail.append(el('h3','detail-title',live ? live.title : method ? method.short : node.title));
  if (method) detail.append(el('pre','signature',method.full));
  detail.append(el('p','detail-text',method?.desc || node.desc));
  if (live?.from) {
    const from=el('div','from');
    from.append(el('b',null,'调用来源 '),document.createTextNode(live.from));
    detail.append(from);
  }
  if (live?.reason) detail.append(el('p','detail-text',live.reason));
  const sourceId=live?.source || method?.source || node.source;
  if (sourceId) detail.append(sourceLink(sources[sourceId]));
  if (live && 'input' in live) detail.append(valueField('输入',live.input,!('output' in live)));
  if (live && 'output' in live) detail.append(valueField('返回 / 当前结果',live.output,true));
  if (live) {
    const state={Phase:s.phase,Step:s.round,MaxSteps:s.maxSteps,Messages:s.messages.length};
    if (s.config.track==='agent') {
      delete state.Phase;
      state.Status=s.phase;
      if (s.calls.length) state.Calls=s.calls.map(({CallID,Status})=>({CallID,Status}));
      if (s.session) state.MCP=s.session;
      if (s.events.length) state.Event=s.events.at(-1);
      if (s.failureClass) state.FailureClass=s.failureClass;
    } else {
      if (s.change) state.Transition=s.change;
      if (s.pending.length) state.Pending=s.pending.map(c=>c.ID);
      if (s.pauseRequest) state.Interrupt=s.pauseRequest.ID;
      if (s.decision) state.Decision=s.decision.Outcome;
      if (s.queries) state.Lookups=s.queries;
      if (s.hostCancelled) state.ExecutionContext='context.Canceled';
    }
    if (s.err) state.Err=s.err;
    detail.append(valueField('状态变化',state,false));
    if (s.at!=='done') detail.append(expandable('后续步骤',el('p',null,live.wait?'等待宿主选择下一步动作。':next(s).view.title)));
  } else if (node.fields.length) {
    detail.append(expandable('关键字段',el('pre','value',node.fields.join('\n'))));
  }
  if (!method && node.methods.length) {
    const list=el('div');
    for (const item of node.methods) {
      const button=el('button','preview-link',item.short);
      button.style.display='block';
      button.onclick=()=>chooseNode(refParts(ref).id+'.'+item.id);
      list.append(button);
    }
    detail.append(expandable('方法',list));
  }
  if (sourceId) detail.append(sourceField(sourceId));
}

function render() {
  const s=now();
  if (!s) return;
  $('step-index').textContent='步骤 '+index;
  $('prev').disabled=index===0;
  $('next').disabled=s.at==='done'||!!s.view?.wait;
  $('play').disabled=playback!==null||s.at==='done'||!!s.view?.wait;
  $('pause-run').disabled=playback===null;
  renderChoices(s);
  showInspector(s);
  updateCanvas(s);
}
configureTrack();
</script>
</body>
</html>
